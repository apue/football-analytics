[project]
name = "football-analytics"
version = "0.1.0"
description = "A question-led football analytics learning project using public event data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.30",
    "jupyterlab>=4.4",
]
analysis = [
    "matplotlib>=3.10",
    "mplsoccer>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_analytics"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
